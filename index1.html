<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEM Dashboard | Cinema & Weather</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --accent-blue: #38bdf8;
            --accent-purple: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #080a0f;
            width: 100vw;
        }

        .intro-screen {
            position: fixed;
            inset: 0;
            background: #080a0f;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease-in-out;
            padding: 20px;
        }

        .intro-title {
            font-size: clamp(2.5rem, 7vw, 4.2rem);
            font-weight: 800;
            text-align: center;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #38bdf8, #e879f9, #ffc000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .intro-subtitle {
            font-size: clamp(0.95rem, 3.5vw, 1.25rem);
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-align: center;
            margin-bottom: 35px;
            max-width: 600px;
            line-height: 1.5;
        }

        .absolute { position: absolute; }
        .inline-block { display: inline-block; }
        .loader { display: flex; margin: 0.25em 0; transform: scale(1.2); }
        .w-2 { width: 0.5em; }
        .dash { animation: dashArray 2s ease-in-out infinite, dashOffset 2s linear infinite; }
        .spin {
            animation: spinDashArray 2s ease-in-out infinite, spin 8s ease-in-out infinite, dashOffset 2s linear infinite;
            transform-origin: center;
        }

        @keyframes dashArray {
            0% { stroke-dasharray: 0 1 359 0; }
            50% { stroke-dasharray: 0 359 1 0; }
            100% { stroke-dasharray: 359 1 0 0; }
        }
        @keyframes spinDashArray {
            0% { stroke-dasharray: 270 90; }
            50% { stroke-dasharray: 0 360; }
            100% { stroke-dasharray: 270 90; }
        }
        @keyframes dashOffset {
            0% { stroke-dashoffset: 365; }
            100% { stroke-dashoffset: 5; }
        }
        @keyframes spin {
            0% { rotate: 0deg; }
            12.5%, 25% { rotate: 270deg; }
            37.5%, 50% { rotate: 540deg; }
            62.5%, 75% { rotate: 810deg; }
            87.5%, 100% { rotate: 1080deg; }
        }

        #mainApp {
            display: none;
            opacity: 0;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            width: 100%;
            transition: opacity 0.6s ease-in-out;
        }

        .bg-wallpaper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.55)), 
                        url('background.png') no-repeat center center fixed;
            background-size: cover;
            z-index: -1;
            pointer-events: none;
        }

        @media (min-width: 601px) and (max-width: 1024px) {
            .bg-wallpaper {
                background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.55)), 
                            url('background2.png') no-repeat center center fixed;
                background-size: cover;
            }
        }

        @media (max-width: 600px) {
            .bg-wallpaper {
                background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.55)), 
                            url('background1.png') no-repeat center center fixed;
                background-size: cover;
            }
        }

        .space-title {
            position: relative;
            z-index: 5;
            color: #fff;
            text-align: center;
            font-family: 'Lato', system-ui, sans-serif;
            font-weight: 800;
            font-size: clamp(2rem, 6vw, 3rem);
            letter-spacing: clamp(6px, 2vw, 12px);
            margin: 10px 0 20px 0;
            text-transform: uppercase;
        }

        .space-title span {
            background: linear-gradient(135deg, #ffffff 0%, #38bdf8 50%, #e879f9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .animate-title {
            animation: introFadeUp 1.2s ease-out forwards;
        }

        @keyframes introFadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .filter-switch-wrapper {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            z-index: 10;
            width: 100%;
        }

        .filter-switch {
            border: 2px solid #ffc000;
            border-radius: 30px;
            position: relative;
            display: flex;
            align-items: center;
            height: 50px;
            width: 100%;
            max-width: 340px;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .filter-switch input { display: none; }

        .filter-switch label {
            flex: 1;
            text-align: center;
            cursor: pointer;
            border: none;
            border-radius: 30px;
            position: relative;
            z-index: 1;
            transition: all 0.5s;
            font-weight: 600;
            font-size: clamp(0.9rem, 4vw, 16px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .filter-switch .background {
            position: absolute;
            width: 49%;
            height: 38px;
            background-color: #ffc000;
            top: 4px;
            left: 4px;
            border-radius: 30px;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #option2:checked ~ .background { left: calc(50% + 1px); }
        #option1:checked + label[for="option1"],
        #option2:checked + label[for="option2"] { color: #212121; font-weight: bold; }
        #option1:not(:checked) + label[for="option1"],
        #option2:not(:checked) + label[for="option2"] { color: #7d7d7d; }

        .main-content-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .header-title {
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-container-wrapper {
            width: 100%;
            max-width: 600px;
            margin-bottom: 15px;
        }

        .input-container {
            display: flex;
            background: linear-gradient(135deg, #23272F 0%, #14161a 100%);
            box-shadow: 10px 10px 25px rgba(0,0,0,0.7), -5px -5px 30px rgba(255,255,255,0.05);
            padding: 0.4rem;
            gap: 0.4rem;
            border-radius: 1rem;
            backdrop-filter: blur(12px);
        }

        .input-container input {
            border-radius: 0.8rem 0 0 0.8rem;
            background: #23272F;
            width: 100%;
            flex-basis: 75%;
            padding: 1rem 1.2rem;
            border: 1px solid transparent;
            color: white;
            font-size: 1rem;
            transition: all 0.2s ease-in-out;
        }

        .input-container input:focus {
            border: 1px solid #FFD43B;
            outline: none;
            box-shadow: inset 0px 0px 10px rgba(255, 102, 0, 0.5), 0px 0px 50px rgba(255, 212, 59, 0.4);
        }

        .input-container button {
            flex-basis: 25%;
            padding: 1rem;
            background: linear-gradient(135deg, rgb(255, 212, 59) 0%, rgb(255, 102, 0) 100%);
            font-weight: 900;
            letter-spacing: 0.1rem;
            text-transform: uppercase;
            color: #23272F;
            border: none;
            width: 100%;
            border-radius: 0 1rem 1rem 0;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .status-badge {
            text-align: center;
            color: #cbd5e1;
            font-size: 0.95rem;
            margin-bottom: 20px;
            min-height: 24px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .selected-movie-card {
            display: none;
            width: 100%;
            max-width: 600px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.2);
            align-items: center;
            gap: 20px;
            animation: fadeIn 0.4s ease forwards;
        }

        .selected-movie-card img {
            width: 110px;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .selected-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            flex-grow: 1;
        }

        .selected-title {
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: 800;
            color: #ffffff;
            line-height: 1.3;
        }

        .selected-detail-item {
            font-size: 0.95rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .selected-detail-item strong {
            color: #38bdf8;
            font-weight: 600;
        }

        .imdb-badge {
            background: #f5c518;
            color: #000000;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 800;
            font-size: 0.85rem;
        }

        .movies-scroll-container {
            width: 100%;
            margin-top: 10px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            width: 100%;
            justify-items: center;
        }

        .card {
            box-sizing: border-box;
            width: 100%;
            max-width: 190px;
            aspect-ratio: 190 / 270;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid white;
            box-shadow: 12px 17px 51px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            border-radius: 17px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            color: white;
            position: relative;
        }

        .card:hover {
            border: 1px solid #38bdf8;
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.3);
        }

        .card.active-selected {
            border: 2px solid #FFD43B;
            box-shadow: 0 0 25px rgba(255, 212, 59, 0.6);
            transform: scale(1.03);
        }

        .card:active {
            transform: scale(0.95) rotateZ(1.7deg);
        }

        .movie-poster-img {
            width: 100%;
            height: 65%;
            object-fit: cover;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .movie-details-box {
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            text-align: left;
            background: rgba(15, 23, 42, 0.85);
        }

        .movie-title-text {
            color: #ffffff;
            font-size: clamp(0.75rem, 3vw, 0.85rem);
            font-weight: 700;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .movie-meta-text {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .badge-tag {
            background: rgba(56, 189, 248, 0.25);
            color: #38bdf8;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .weather-card-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            width: 100%;
        }

        .weather-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 100%;
            max-width: 320px;
            aspect-ratio: 320 / 460;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            background-color: white;
        }

        .landscape-section {
            position: relative;
            width: 100%;
            height: 60%;
            overflow: hidden;
        }

        .landscape-section * { position: absolute; }
        .sky { width: 100%; height: 100%; background: linear-gradient(0deg, rgba(247, 225, 87, 1) 0%, rgba(233, 101, 148, 1) 100%); }
        .sun { width: 52px; height: 52px; border-radius: 50%; background-color: white; bottom: 40%; left: 23%; filter: drop-shadow(0px 0px 10px white); }
        .ocean { bottom: 0; width: 100%; height: 28%; background: linear-gradient(0deg, rgba(241, 192, 125, 1) 0%, rgba(247, 218, 150, 1) 100%); }
        .reflection { position: absolute; background-color: white; opacity: 0.5; z-index: 1; }
        .reflection:nth-child(1) { width: 40px; height: 10px; clip-path: polygon(0% 0%, 100% 0%, 50% 20%); top: 5%; left: 32%; }
        .reflection:nth-child(2) { width: 80px; height: 15px; clip-path: polygon(0% 0%, 100% 0%, 60% 20%, 40% 20%); top: 15%; left: 39%; }

        .hill-1 { right: -25%; bottom: 20%; width: 160px; height: 45px; border-radius: 50%; background-color: #e6b29d; }
        .hill-2 { right: -36%; bottom: 10%; width: 160px; height: 85px; border-radius: 50%; background-color: #c29182; }
        .hill-3 { left: -100%; bottom: -28%; width: 380px; height: 160px; border-radius: 50%; background-color: #b77873; z-index: 3; }

        .content-section {
            width: 100%;
            height: 40%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            background: #ffffff;
        }

        .weather-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: absolute;
            top: -130px;
            left: 0;
            width: 100%;
            padding: 14px 20px;
            color: white;
            z-index: 10;
        }

        .weather-emoji { font-size: 2.2rem; margin-bottom: 2px; }
        .weather-info .right-side { display: flex; flex-direction: column; align-items: flex-end; }
        .location { display: flex; align-items: center; gap: 4px; font-size: 11pt; font-weight: 700; text-transform: uppercase; }
        .temperature { font-size: clamp(18pt, 6vw, 24pt); font-weight: 800; line-height: 30px; }

        .metrics-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            padding: 14px 5px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            color: #334155;
            font-size: clamp(0.7rem, 2.5vw, 0.82rem);
            font-weight: 600;
        }

        .metric-item { display: flex; align-items: center; gap: 4px; }
        .metric-item i { color: #0284c7; }

        .forecast {
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            height: 100%;
            width: 100%;
            padding: 8px 20px;
            color: #64748b;
            font-size: clamp(0.75rem, 3vw, 0.85rem);
        }

        .forecast > div { display: flex; justify-content: space-between; width: 100%; font-weight: 500; }
        .separator { width: 100%; height: 1px; background-color: #f1f5f9; }

        .loader-wrapper { display: none; justify-content: center; padding: 30px 0; }
        .view-section { display: none; width: 100%; flex-direction: column; align-items: center; }
        .view-section.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .input-container { flex-direction: column; border-radius: 1.2rem; }
            .input-container input { border-radius: 1rem; text-align: center; }
            .input-container button { border-radius: 1rem; padding: 0.8rem; }
            
            .selected-movie-card { flex-direction: column; text-align: center; gap: 10px; }
            .selected-info { align-items: center; }
            
            .movies-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .weather-card { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div id="introScreen" class="intro-screen">
        <h1 class="intro-title">WEM Dashboard</h1>
        <p class="intro-subtitle">Get your weather and movies details at one platform</p>
        
        <div class="loader">
          <svg height="0" width="0" viewBox="0 0 64 64" class="absolute">
            <defs class="s-xJBuHA073rTt" xmlns="http://www.w3.org/2000/svg">
              <linearGradient class="s-xJBuHA073rTt" gradientUnits="userSpaceOnUse" y2="2" x2="0" y1="62" x1="0" id="b">
                <stop class="s-xJBuHA073rTt" stop-color="#973BED"></stop>
                <stop class="s-xJBuHA073rTt" stop-color="#007CFF" offset="1"></stop>
              </linearGradient>
              <linearGradient class="s-xJBuHA073rTt" gradientUnits="userSpaceOnUse" y2="0" x2="0" y1="64" x1="0" id="c">
                <stop class="s-xJBuHA073rTt" stop-color="#FFC800"></stop>
                <stop class="s-xJBuHA073rTt" stop-color="#F0F" offset="1"></stop>
                <animateTransform repeatCount="indefinite" keySplines=".42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1" keyTimes="0; 0.125; 0.25; 0.375; 0.5; 0.625; 0.75; 0.875; 1" dur="8s" values="0 32 32;-270 32 32;-270 32 32;-540 32 32;-540 32 32;-810 32 32;-810 32 32;-1080 32 32;-1080 32 32" type="rotate" attributeName="gradientTransform"></animateTransform>
              </linearGradient>
              <linearGradient class="s-xJBuHA073rTt" gradientUnits="userSpaceOnUse" y2="2" x2="0" y1="62" x1="0" id="d">
                <stop class="s-xJBuHA073rTt" stop-color="#00E0ED"></stop>
                <stop class="s-xJBuHA073rTt" stop-color="#00DA72" offset="1"></stop>
              </linearGradient>
            </defs>
          </svg>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" height="64" width="64" class="inline-block">
            <path stroke-linejoin="round" stroke-linecap="round" stroke-width="8" stroke="url(#b)" d="M 54.722656,3.9726563 A 2.0002,2.0002 0 0 0 54.941406,4 h 5.007813 C 58.955121,17.046124 49.099667,27.677057 36.121094,29.580078 a 2.0002,2.0002 0 0 0 -1.708985,1.978516 V 60 H 29.587891 V 31.558594 A 2.0002,2.0002 0 0 0 27.878906,29.580078 C 14.900333,27.677057 5.0448787,17.046124 4.0507812,4 H 9.28125 c 1.231666,11.63657 10.984383,20.554048 22.6875,20.734375 a 2.0002,2.0002 0 0 0 0.02344,0 c 11.806958,0.04283 21.70649,-9.003371 22.730469,-20.7617187 z" class="dash" id="y" pathLength="360"></path>
          </svg>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" style="--rotation-duration:0ms; --rotation-direction:normal;" viewBox="0 0 64 64" height="64" width="64" class="inline-block">
            <path stroke-linejoin="round" stroke-linecap="round" stroke-width="10" stroke="url(#c)" d="M 32 32 m 0 -27 a 27 27 0 1 1 0 54 a 27 27 0 1 1 0 -54" class="spin" id="o" pathLength="360"></path>
          </svg>
          <div class="w-2"></div>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" style="--rotation-duration:0ms; --rotation-direction:normal;" viewBox="0 0 64 64" height="64" width="64" class="inline-block">
            <path stroke-linejoin="round" stroke-linecap="round" stroke-width="8" stroke="url(#d)" d="M 4,4 h 4.6230469 v 25.919922 c -0.00276,11.916203 9.8364941,21.550422 21.7500001,21.296875 11.616666,-0.240651 21.014356,-9.63894 21.253906,-21.25586 a 2.0002,2.0002 0 0 0 0,-0.04102 V 4 H 56.25 v 25.919922 c 0,14.33873 -11.581192,25.919922 -25.919922,25.919922 a 2.0002,2.0002 0 0 0 -0.0293,0 C 15.812309,56.052941 3.998433,44.409961 4,29.919922 Z" class="dash" id="u" pathLength="360"></path>
          </svg>
        </div>
    </div>

    <div id="mainApp">

        <div class="bg-wallpaper"></div>

        <div id="title" class="space-title"><span>CINEMA</span></div>

        <div class="filter-switch-wrapper">
            <div class="filter-switch">
              <input checked="" id="option1" name="options" type="radio" onchange="switchView('movie')" />
              <label class="option" for="option1"><i class="fa-solid fa-film"></i> Movies</label>
              <input id="option2" name="options" type="radio" onchange="switchView('weather')" />
              <label class="option" for="option2"><i class="fa-solid fa-cloud-sun"></i> Weather</label>
              <span class="background"></span>
            </div>
        </div>

        <div class="main-content-section">
            
            <div id="movieSection" class="view-section active">
                <h1 class="header-title">Cinema Finder</h1>
                <div class="input-container-wrapper">
                    <div class="input-container">
                      <input type="text" id="movieInput" placeholder="Search Movie Title (e.g. Batman, Marvel)...">
                      <button onclick="handleMovieSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>
                </div>
                
                <div id="movieStatus" class="status-badge">Enter a title above to search movies</div>

                <div id="selectedMovieCard" class="selected-movie-card">
                    <img id="selectedPoster" src="" alt="Selected Poster">
                    <div class="selected-info">
                        <div id="selectedTitle" class="selected-title">Movie Title</div>
                        <div class="selected-detail-item">
                            <strong>Release Year:</strong> <span id="selectedYear">--</span>
                        </div>
                        <div class="selected-detail-item">
                            <strong>IMDb ID:</strong> <span id="selectedImdb" class="imdb-badge">--</span>
                        </div>
                        <div class="selected-detail-item">
                            <strong>Type:</strong> <span id="selectedType" style="text-transform: capitalize;">--</span>
                        </div>
                    </div>
                </div>

                <div id="movieLoaderWrapper" class="loader-wrapper"><i class="fa-solid fa-spinner fa-spin fa-2x" style="color: #ffc000;"></i></div>
                <div id="moviesContainer" class="movies-scroll-container" style="display: none;">
                    <div id="moviesGrid" class="movies-grid"></div>
                </div>
            </div>

            <div id="weatherSection" class="view-section">
                <h1 class="header-title">Weather Forecast</h1>
                <div class="input-container-wrapper">
                    <div class="input-container">
                      <input type="text" id="cityInput" placeholder="Search City Name (e.g. Mumbai, Tokyo)...">
                      <button onclick="handleWeatherSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>
                </div>
                <div id="weatherStatus" class="status-badge">Search a city above to display atmospheric metrics</div>
                <div id="weatherLoaderWrapper" class="loader-wrapper"><i class="fa-solid fa-spinner fa-spin fa-2x" style="color: #ffc000;"></i></div>
                
                <div id="weatherCardWrapper" class="weather-card-wrapper" style="display: none;">
                    <div class="weather-card">
                      <section class="landscape-section">
                        <div class="sky"></div>
                        <div class="sun"></div>
                        <div class="hill-1"></div>
                        <div class="hill-2"></div>
                        <div class="ocean">
                          <div class="reflection"></div>
                          <div class="reflection"></div>
                        </div>
                        <div class="hill-3"></div>
                      </section>
                      
                      <section class="content-section">
                        <div class="weather-info">
                          <div class="left-side">
                            <div id="weatherEmoji" class="weather-emoji">☀️</div>
                            <p id="weatherCondText">Clear Sky</p>
                          </div>
                          <div class="right-side">
                            <div class="location">
                              <i class="fa-solid fa-location-dot"></i>
                              <span id="cityNameText">City</span>
                            </div>
                            <p id="currentDateText" style="font-size: 8pt; margin: 2px 0;">--</p>
                            <p id="currentTempText" class="temperature">--°C</p>
                          </div>
                        </div>

                        <div class="metrics-bar">
                            <div class="metric-item"><i class="fa-solid fa-wind"></i> <span id="windSpeedText">-- km/h</span></div>
                            <div class="metric-item"><i class="fa-solid fa-droplet"></i> <span id="humidityText">--%</span></div>
                            <div class="metric-item"><i class="fa-solid fa-leaf"></i> <span id="airQualityText">Good</span></div>
                        </div>

                        <div id="forecastContainer" class="forecast"></div>
                      </section>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const intro = document.getElementById('introScreen');
                const app = document.getElementById('mainApp');
                
                intro.style.opacity = '0';
                
                setTimeout(() => {
                    intro.style.display = 'none';
                    app.style.display = 'flex';
                    
                    void app.offsetWidth;
                    app.style.opacity = '1';
                    
                    switchView('movie');
                }, 600);
            }, 3000);
        });

        function switchView(view) {
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
            const titleElement = document.getElementById('title');

            titleElement.classList.remove('animate-title');
            void titleElement.offsetWidth;
            titleElement.classList.add('animate-title');

            if (view === 'movie') {
                document.getElementById('movieSection').classList.add('active');
                titleElement.innerHTML = "<span>CINEMA</span>";
            } else {
                document.getElementById('weatherSection').classList.add('active');
                titleElement.innerHTML = "<span>WEATHER</span>";
            }
        }

        function selectMovie(movie, cardElement) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active-selected'));
            cardElement.classList.add('active-selected');

            document.getElementById('selectedPoster').src = (movie.Poster && movie.Poster !== "N/A") ? movie.Poster : 'https://via.placeholder.com/300x450/0f172a/94a3b8?text=No+Poster';
            document.getElementById('selectedTitle').textContent = movie.Title;
            document.getElementById('selectedYear').textContent = movie.Year;
            document.getElementById('selectedImdb').textContent = movie.imdbID;
            document.getElementById('selectedType').textContent = movie.Type;

            const panel = document.getElementById('selectedMovieCard');
            panel.style.display = 'flex';
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        async function getMovies(query) {
            const status = document.getElementById('movieStatus');
            const container = document.getElementById('moviesContainer');
            const grid = document.getElementById('moviesGrid');
            const loader = document.getElementById('movieLoaderWrapper');
            const selectedCard = document.getElementById('selectedMovieCard');

            status.textContent = "Searching movie database...";
            loader.style.display = "flex";
            container.style.display = 'none';
            selectedCard.style.display = 'none';
            grid.innerHTML = '';

            try {
                const response = await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(query)}&apikey=2e40479a`);
                const data = await response.json();
                loader.style.display = "none";

                if (data.Response === "True" && data.Search) {
                    status.textContent = `Found ${data.Search.length} results for "${query}". Click any movie poster below to view details!`;
                    data.Search.forEach(movie => {
                        const posterSrc = (movie.Poster && movie.Poster !== "N/A") ? movie.Poster : 'https://via.placeholder.com/300x450/0f172a/94a3b8?text=No+Poster';
                        
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.onclick = () => selectMovie(movie, card);
                        
                        card.innerHTML = `
                            <div class="card-inner">
                                <img class="movie-poster-img" src="${posterSrc}" alt="${movie.Title}">
                                <div class="movie-details-box">
                                    <div class="movie-title-text" title="${movie.Title}">${movie.Title}</div>
                                    <div class="movie-meta-text">
                                        <span>${movie.Year}</span>
                                        <span class="badge-tag">${movie.Type}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                    container.style.display = 'block';
                } else {
                    status.textContent = "No movies found matching that title. Try another search!";
                }
            } catch (err) {
                loader.style.display = "none";
                status.textContent = "Error loading movie data. Please check your connection.";
            }
        }

        function handleMovieSearch() {
            const query = document.getElementById('movieInput').value.trim();
            if (query) getMovies(query);
        }

        const wCodeMap = {
            0: { text: "Clear Sky", emoji: "☀️" },
            1: { text: "Mainly Clear", emoji: "🌤️" },
            2: { text: "Partly Cloudy", emoji: "⛅" },
            3: { text: "Overcast", emoji: "☁️" },
            45: { text: "Foggy", emoji: "🌫️" },
            61: { text: "Light Rain", emoji: "🌧️" },
            63: { text: "Moderate Rain", emoji: "🌧️" },
            71: { text: "Snowfall", emoji: "❄️" },
            95: { text: "Thunderstorm", emoji: "🌩️" }
        };

        function formatDate(dateObj) {
            return dateObj.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' });
        }

        async function getWeather(city) {
            const status = document.getElementById('weatherStatus');
            const cardWrapper = document.getElementById('weatherCardWrapper');
            const loader = document.getElementById('weatherLoaderWrapper');

            status.textContent = `Retrieving weather metrics for ${city}...`;
            loader.style.display = "flex";
            cardWrapper.style.display = 'none';

            try {
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
                const geoData = await geoRes.json();

                if (!geoData.results || geoData.results.length === 0) {
                    loader.style.display = "none";
                    status.textContent = "City not found. Please check spelling.";
                    return;
                }

                const loc = geoData.results[0];

                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weathercode&daily=temperature_2m_max,temperature_2m_min&timezone=auto`);
                const wData = await weatherRes.json();

                loader.style.display = "none";

                if (wData.current) {
                    status.textContent = `Showing current weather for ${loc.name}`;
                    
                    document.getElementById('cityNameText').textContent = loc.name;
                    document.getElementById('currentTempText').textContent = `${Math.round(wData.current.temperature_2m)}°C`;
                    document.getElementById('currentDateText').textContent = formatDate(new Date());

                    const cond = wCodeMap[wData.current.weathercode] || { text: "Cloudy", emoji: "☁️" };
                    document.getElementById('weatherCondText').textContent = cond.text;
                    document.getElementById('weatherEmoji').textContent = cond.emoji;

                    document.getElementById('windSpeedText').textContent = `${Math.round(wData.current.wind_speed_10m)} km/h`;
                    document.getElementById('humidityText').textContent = `${wData.current.relative_humidity_2m}%`;
                    document.getElementById('airQualityText').textContent = wData.current.relative_humidity_2m > 70 ? "Humid" : "Good";

                    const forecastContainer = document.getElementById('forecastContainer');
                    forecastContainer.innerHTML = '';

                    for (let i = 1; i <= 3; i++) {
                        const dateObj = new Date(wData.daily.time[i] + "T00:00:00");
                        const tempMax = Math.round(wData.daily.temperature_2m_max[i]);
                        const tempMin = Math.round(wData.daily.temperature_2m_min[i]);

                        const row = document.createElement('div');
                        row.innerHTML = `<span>${formatDate(dateObj)}</span><span>${tempMax}° / ${tempMin}°C</span>`;
                        forecastContainer.appendChild(row);

                        if (i < 3) {
                            const sep = document.createElement('div');
                            sep.className = 'separator';
                            forecastContainer.appendChild(sep);
                        }
                    }

                    cardWrapper.style.display = 'flex';
                }
            } catch (err) {
                loader.style.display = "none";
                status.textContent = "Error retrieving weather metrics.";
            }
        }

        function handleWeatherSearch() {
            const query = document.getElementById('cityInput').value.trim();
            if (query) getWeather(query);
        }

        document.getElementById('movieInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleMovieSearch(); });
        document.getElementById('cityInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleWeatherSearch(); });
    </script>
</body>
</html>
